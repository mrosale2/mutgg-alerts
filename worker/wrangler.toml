name = "mutgg-alerts"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Cron trigger: poll mut.gg every 2 minutes.
# (Cloudflare's minimum cron interval is 1 minute on the free plan.)
[triggers]
crons = ["*/2 * * * *"]

# KV namespace for storing watches + dedup fingerprints.
# Replace the id below with the one returned by `wrangler kv:namespace create WATCHES`.
[[kv_namespaces]]
binding = "WATCHES"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set via `wrangler secret put`, not in this file):
#   DISCORD_WEBHOOK  — your Discord channel webhook URL
#   AUTH_SECRET      — random string used to gate the management UI / API

# Observability (optional, free tier).
[observability]
enabled = true
