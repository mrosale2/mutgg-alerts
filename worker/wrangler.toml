name = "mutgg-alerts"
main = "src/index.js"
compatibility_date = "2026-05-01"

# Expose the Worker on the free https://<name>.<subdomain>.workers.dev URL.
workers_dev = true

# Cron triggers:
#   "* * * * *"    — every minute: poll mut.gg for live auctions
#   "0 8 * * *"    — daily at 08:00 UTC (~midnight-3am PT): refresh filter candidates
[triggers]
crons = ["* * * * *", "0 8 * * *"]

# KV namespace for storing watches + dedup fingerprints.
# Replace the id below with the one returned by `wrangler kv:namespace create WATCHES`.
[[kv_namespaces]]
binding = "WATCHES"
id = "5cb145f547e847ecb52189f6f099ccc9"

# Secrets (set via `wrangler secret put`, not in this file):
#   DISCORD_WEBHOOK  — your Discord channel webhook URL
#   AUTH_SECRET      — random string used to gate the management UI / API

# Observability (optional, free tier).
[observability]
enabled = true
